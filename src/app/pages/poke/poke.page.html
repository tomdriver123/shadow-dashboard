<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Poke Finder</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [scrollY]="false">
  <div class="finder">
    <main #sheet [class.is-expanded]="expanded()">
      <div id="sheet" class="sheet-content">
        <app-town-panel [towns]="towns()" [loading]="loading()" [error]="error()" [selectedId]="id()" [game]="game()">
          @if (id() !== undefined) {
            <a
              data-slot="start"
              class="back"
              [routerLink]="pokePath"
              aria-label="Back to towns"
              title="Back to towns"
            >
              <svg
                aria-hidden="true"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M15 5l-7 7 7 7" />
              </svg>
            </a>
          } @else {
            <button
              data-slot="start"
              type="button"
              class="recenter"
              aria-label="Recenter map"
              title="Recenter map"
              (click)="recenter()"
            >
              <svg
                aria-hidden="true"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <circle cx="12" cy="12" r="6" />
                <path d="M12 2v4M12 18v4M2 12h4M18 12h4" />
              </svg>
            </button>
          }
          @if (encounterTown(); as town) {
            <app-encounter-card data-slot="encounter" [town]="town" [game]="game()" />
          }
          @if (isMobile()) {
            <button
              data-slot="end"
              type="button"
              class="sheet-toggle"
              [attr.aria-expanded]="expanded()"
              aria-controls="sheet"
              [attr.aria-label]="expanded() ? 'Show less' : 'Show more'"
              [title]="expanded() ? 'Show less' : 'Show more'"
              (click)="toggleSheet()"
            >
              <svg
                aria-hidden="true"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M5 15l7-7 7 7" />
              </svg>
            </button>
          }
        </app-town-panel>
      </div>
    </main>
    <aside aria-label="Map" (focusin)="onMapFocusIn()">
      <app-town-map
        [towns]="towns()"
        [routes]="routes()"
        [selectedId]="id()"
        [centerOffset]="centerOffset()"
        [fitRequest]="fitRequest()"
        (select)="onSelect($event)"
      />
    </aside>
  </div>
</ion-content>
