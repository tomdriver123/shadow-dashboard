<ion-content [fullscreen]="true" [scrollY]="false">
  <div class="shell-layout">
    <nav class="shell-sidebar">
      <button *ngFor="let d of dashboards; let i = index"
              type="button"
              class="sidebar-item"
              [class.active]="activeIndex === i"
              (click)="jumpTo(i)">
        <ion-icon [name]="d.icon"></ion-icon>
        <span>{{ d.title }}</span>
      </button>
    </nav>

    <swiper-container #swiperEl
                      class="shell-swiper"
                      direction="vertical"
                      [attr.initial-slide]="initialSlide">
      <swiper-slide *ngFor="let d of dashboards">
        <sh-dashboard-card [title]="d.title">
          <ng-container *ngComponentOutlet="d.component"></ng-container>
        </sh-dashboard-card>
      </swiper-slide>
    </swiper-container>
  </div>
</ion-content>
