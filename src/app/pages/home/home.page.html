<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Shadow</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/sabrina" routerDirection="root" (click)="enterSabrina()">
        <ion-icon slot="start" name="person-circle-outline"></ion-icon>
        Sabrina
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [scrollY]="false">
  <div class="shell-layout">
    <nav class="shell-sidebar">
      <button *ngFor="let d of dashboards; let i = index"
              type="button"
              class="sidebar-item"
              [class.active]="activeIndex === i"
              (click)="jumpTo(i)">
        <ion-icon [name]="d.icon"></ion-icon>
        <span>{{ d.title }}</span>
      </button>
    </nav>

    <swiper-container #swiperEl
                      class="shell-swiper"
                      direction="vertical"
                      [attr.initial-slide]="initialSlide">
      <swiper-slide *ngFor="let d of dashboards">
        <sh-dashboard-card [title]="d.title">
          <ng-container *ngComponentOutlet="d.component"></ng-container>
        </sh-dashboard-card>
      </swiper-slide>
    </swiper-container>
  </div>
</ion-content>
