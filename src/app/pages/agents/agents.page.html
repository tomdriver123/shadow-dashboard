<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Agents</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Agents</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Summary bar -->
  <div class="summary-bar">
    <span class="summary-item summary-item--active">{{ counts.active }} active</span>
    <span class="summary-sep">·</span>
    <span class="summary-item summary-item--paused">{{ counts.paused }} paused</span>
    <span class="summary-sep">·</span>
    <span class="summary-item summary-item--planned">{{ counts.planned }} planned</span>
  </div>

  <!-- Filter tabs -->
  <div class="filter-tabs">
    <button
      class="filter-tab"
      *ngFor="let f of filters"
      [class.active]="activeFilter === f"
      (click)="setFilter(f)"
    >{{ f }}</button>
  </div>

  <ion-grid>
    <ion-row>
      <ion-col size="6" size-md="4" size-lg="2" *ngFor="let agent of filteredAgents">
        <app-agent-card [agent]="agent"></app-agent-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
