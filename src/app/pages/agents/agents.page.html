<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Agents</ion-title>
    <ion-buttons slot="end">
      <sh-refresh-button target="agents"></sh-refresh-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Agents</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Shadow — top center -->
  <div class="shadow-row" *ngIf="shadowAgent">
    <div class="agent-circle agent-circle--hero" (click)="openChat(shadowAgent)">
      <div class="agent-circle__avatar" [style.border-color]="shadowAgent.color">
        <img *ngIf="shadowAgent.imageUrl" [src]="shadowAgent.imageUrl" [alt]="shadowAgent.name" />
      </div>
      <div class="agent-circle__name">{{ shadowAgent.name }}</div>
      <div class="agent-circle__role">{{ shadowAgent.role.split(' — ')[0] }}</div>
    </div>
  </div>

  <!-- Team — 2x2 on mobile, 1x4 on desktop -->
  <div class="team-grid">
    <div
      class="agent-circle"
      *ngFor="let agent of teamAgents"
      (click)="openChat(agent)"
    >
      <div class="agent-circle__avatar" [style.border-color]="agent.color">
        <img *ngIf="agent.imageUrl" [src]="agent.imageUrl" [alt]="agent.name" />
        <span *ngIf="!agent.imageUrl" class="agent-circle__initial" [style.background-color]="agent.color">
          {{ agent.name.charAt(0) }}
        </span>
      </div>
      <div class="agent-circle__name">{{ agent.name }}</div>
      <div class="agent-circle__role">{{ agent.role.split(' — ')[0] }}</div>
    </div>
  </div>

  <div class="section-label">Knowledge</div>
  <div class="knowledge-row">
    <div class="agent-circle" (click)="openBrain()">
      <div class="agent-circle__avatar" [style.border-color]="'#f59e0b'">
        <ion-icon name="bulb-outline" class="agent-circle__glyph"></ion-icon>
      </div>
      <div class="agent-circle__name">Brain</div>
      <div class="agent-circle__role">Insights and research</div>
    </div>
  </div>
</ion-content>
