<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Agents</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Agents</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Shadow hero card -->
  <div class="shadow-hero" *ngIf="shadow">
    <div class="shadow-hero__avatar" [style.background-color]="shadow.color">
      <img *ngIf="shadow.imageUrl" [src]="shadow.imageUrl" [alt]="shadow.name" />
      <span *ngIf="!shadow.imageUrl" class="shadow-hero__initial">S</span>
    </div>
    <div class="shadow-hero__body">
      <div class="shadow-hero__label">System Lead</div>
      <div class="shadow-hero__name">{{ shadow.name }}</div>
      <div class="shadow-hero__role">{{ shadow.role }}</div>
      <div class="shadow-hero__meta">
        <ion-icon name="hardware-chip-outline"></ion-icon>
        <span>{{ shadow.model }}</span>
        <span class="meta-sep">·</span>
        <ion-icon name="time-outline"></ion-icon>
        <span>{{ shadow.heartbeat }}</span>
      </div>
    </div>
  </div>

  <!-- Team section -->
  <div class="team-label">The Team</div>

  <ion-grid>
    <ion-row>
      <ion-col size="6" size-md="4" size-lg="3" *ngFor="let agent of teamAgents">
        <app-agent-card [agent]="agent"></app-agent-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
